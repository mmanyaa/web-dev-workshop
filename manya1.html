<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Embedding Example</title>
    <link rel="stylesheet" href="asd.css">
</head>
<body>
    <h1>Embedding an Image in HTML</h1>

    <div class="image-container">
        <img 
         src="https://biographywiki.net/wp-content/uploads/2019/11/Bollywood-actress-anushka-sharma-hot-looking-biogrpahy-age-height-wiki.jpg"
            img="Scenic_View.jpg" 
            alt="Scenic view of nature with mountains and a lake" 
            img {
            width="300px"
            border-radius :50%; 
            margin button:20px;
            border:solid #4CAF50;
            }
            title="Beautiful Nature Scene">
        <p>hii i am anushka sharma.</p>
    </div>
</body>
</html>
